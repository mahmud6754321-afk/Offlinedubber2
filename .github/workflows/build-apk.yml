name: Video Translator APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Files
        run: |
          bash part1.sh
          bash part1b.sh
          bash part2.sh

      - name: Process App Logo and Launcher Icons
        run: |
          python3 -m venv /tmp/pil
          /tmp/pil/bin/pip install -q pillow
          /tmp/pil/bin/python - << 'PYEOF'
          import glob, os
          from PIL import Image

          files = []
          for pat in ("*.png", "*.jpg", "*.jpeg", "*.webp", "*.PNG", "*.JPG", "*.JPEG", "*.WEBP"):
              files.extend(glob.glob(pat))

          if files:
              print("Using uploaded logo:", files[0])
              img = Image.open(files[0]).convert("RGBA")
          else:
              print("No logo image found, using fallback")
              img = Image.new("RGBA", (512, 512), (0, 0, 0, 255))

          w, h = img.size
          side = min(w, h)
          img = img.crop(((w - side) // 2, (h - side) // 2, (w + side) // 2, (h + side) // 2))

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          img.resize((512, 512), Image.LANCZOS).save("app/src/main/res/drawable/app_logo.png")

          for d, sz in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              folder = f"app/src/main/res/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              resized = img.resize((sz, sz), Image.LANCZOS)
              resized.save(f"{folder}/ic_launcher.png")
              resized.save(f"{folder}/ic_launcher_round.png")
          PYEOF

      - name: Download Whisper Base & Silero VAD Models
        run: |
          curl -L --fail -o app/src/main/assets/whisper/base-encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-encoder.int8.onnx
          curl -L --fail -o app/src/main/assets/whisper/base-decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-decoder.int8.onnx
          curl -L --fail -o app/src/main/assets/whisper/base-tokens.txt \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-tokens.txt
          curl -L --fail -o app/src/main/assets/whisper/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVideoDubber-APK
          path: app/build/outputs/apk/debug/app-debug.apk
