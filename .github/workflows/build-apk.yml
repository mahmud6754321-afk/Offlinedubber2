name: Video Translator APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Files
        run: |
          bash part1.sh
          bash part1b.sh
          bash part2.sh

      - name: Process App Logo and Launcher Icons
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          LOGO_FILE=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          if [ -n "$LOGO_FILE" ]; then
            echo "Using uploaded logo: $LOGO_FILE"
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=512:512:force_original_aspect_ratio=increase,crop=512:512" app/src/main/res/drawable/app_logo.png
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=48:48:force_original_aspect_ratio=increase,crop=48:48" app/src/main/res/mipmap-mdpi/ic_launcher.png
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=72:72:force_original_aspect_ratio=increase,crop=72:72" app/src/main/res/mipmap-hdpi/ic_launcher.png
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=96:96:force_original_aspect_ratio=increase,crop=96:96" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=144:144:force_original_aspect_ratio=increase,crop=144:144" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            ffmpeg -y -i "$LOGO_FILE" -vf "scale=192:192:force_original_aspect_ratio=increase,crop=192:192" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            echo "No logo image found, using fallback"
            ffmpeg -y -f lavfi -i color=c=black:s=512x512 -frames:v 1 app/src/main/res/drawable/app_logo.png
            ffmpeg -y -f lavfi -i color=c=black:s=48x48 -frames:v 1 app/src/main/res/mipmap-mdpi/ic_launcher.png
            ffmpeg -y -f lavfi -i color=c=black:s=72x72 -frames:v 1 app/src/main/res/mipmap-hdpi/ic_launcher.png
            ffmpeg -y -f lavfi -i color=c=black:s=96x96 -frames:v 1 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            ffmpeg -y -f lavfi -i color=c=black:s=144x144 -frames:v 1 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            ffmpeg -y -f lavfi -i color=c=black:s=192x192 -frames:v 1 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Download Whisper Base & Silero VAD Models
        run: |
          curl -L --fail -o app/src/main/assets/whisper/base-encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-encoder.int8.onnx
          curl -L --fail -o app/src/main/assets/whisper/base-decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-decoder.int8.onnx
          curl -L --fail -o app/src/main/assets/whisper/base-tokens.txt \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-tokens.txt
          curl -L --fail -o app/src/main/assets/whisper/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVideoDubber-APK
          path: app/build/outputs/apk/debug/app-debug.apk
